[package]
name = "solve"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[[bin]]
name = "solve"
path = "src/main.rs"

[dependencies]
memmap2 = "0.9"
mimalloc = { version = "0.1", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"
overflow-checks = false
